# Dependency updates for CI and the preview tooling only. Versions that must move in
# step across the recipe, the end-to-end test and the previews are left out (see
# CLAUDE.md): FullCalendar (shared.liquid, preview/package.json), LaraPaper (the add-on
# image in .github/workflows/larapaper.yml, keepsuit/liquid in preview/php), the TRMNL
# framework and trmnlp.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /preview
    schedule:
      interval: monthly
    groups:
      preview:
        patterns: ["*"]
    ignore:
      # Pinned to the version the recipe loads.
      - dependency-name: fullcalendar
      - dependency-name: "@fullcalendar/core"
