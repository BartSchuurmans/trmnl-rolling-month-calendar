name: App

# Lints the Home Assistant app, builds its image (amd64) and starts it with a fake
# /data to check that LaraPaper comes up, serves the bundled framework, fonts and
# FullCalendar, and picked up the app options. It then runs the end-to-end test
# (e2e/run.mjs): the recipe ZIP is imported into that LaraPaper, polls a fake Home
# Assistant and is rendered for a TRMNL X through the device API; and drives the web UI
# through a fake Home Assistant ingress (e2e/ingress.mjs). On pull requests it
# also checks that changes to the image come with a new app version: Home Assistant
# only offers an update when `version` in config.yaml changes. On main, once all of that
# passes, it publishes the image for each architecture to GHCR under `image` from
# config.yaml (the version and `latest`), unless that version is already published:
# Home Assistant pulls it from there instead of building it.

on:
  pull_request:
    paths: [larapaper/**, repository.yaml, plugin/**, e2e/**, scripts/build-zip.sh, .github/workflows/app.yml]
  push:
    branches: [main]
    paths: [larapaper/**, repository.yaml, plugin/**, e2e/**, scripts/build-zip.sh, .github/workflows/app.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: LaraPaper tag matches the app version
        run: |
          version="$(yq '.version' larapaper/config.yaml)"
          base="$(sed -n 's/^ARG BUILD_FROM=//p' larapaper/Dockerfile)"
          tag="${base##*:}"
          case "$version" in
            "$tag"-*) ;;
            *) echo "::error file=larapaper/config.yaml::version $version doesn't match LaraPaper $tag in the Dockerfile; use $tag-N"; exit 1 ;;
          esac
          echo "app version $version"

      - name: App changes bump the version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # DOCS.md, CHANGELOG.md and translations are read from the repository,
          # everything else only reaches users through a rebuild
          changed="$(git diff --name-only "$BASE"...HEAD -- larapaper ':!larapaper/DOCS.md' ':!larapaper/CHANGELOG.md' ':!larapaper/translations')"
          [ -n "$changed" ] || exit 0
          old="$(git show "$BASE:larapaper/config.yaml" | yq '.version')"
          new="$(yq '.version' larapaper/config.yaml)"
          if [ "$old" = "$new" ]; then
            echo "Changed:"; echo "$changed"
            echo "::error file=larapaper/config.yaml::app files changed but version is still $old; bump it (e.g. to the next -N) so Home Assistant offers the update"
            exit 1
          fi
          echo "version $old → $new"
          if ! grep -qxF "## $new" larapaper/CHANGELOG.md; then
            echo "::error file=larapaper/CHANGELOG.md::no \"## $new\" entry in larapaper/CHANGELOG.md"
            exit 1
          fi

      # The entry for the current version is what Home Assistant's update dialog shows:
      # the LaraPaper release's own notes (on <LaraPaper version>-1) under "### LaraPaper
      # <version>", then the app's changes under "### Home Assistant app". The job summary
      # carries LaraPaper's notes as scripts/larapaper-release-notes.sh writes them.
      - name: Changelog entry has the LaraPaper notes and the app's changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(yq '.version' larapaper/config.yaml)"
          tag="$(sed -n 's/^ARG BUILD_FROM=.*://p' larapaper/Dockerfile)"
          entry="$(awk -v h="## $version" '$0 == h { on = 1; next } on && /^## / { exit } on' larapaper/CHANGELOG.md)"
          if [ -z "$entry" ]; then
            echo "::error file=larapaper/CHANGELOG.md::no \"## $version\" entry in larapaper/CHANGELOG.md"
            exit 1
          fi
          status=0
          if ! printf '%s\n' "$entry" | grep -qxF '### Home Assistant app'; then
            echo "::error file=larapaper/CHANGELOG.md::the \"## $version\" entry has no \"### Home Assistant app\" section"
            status=1
          fi
          [ "$version" = "$tag-1" ] || exit "$status"
          if ! printf '%s\n' "$entry" | grep -qxF "### LaraPaper $tag"; then
            echo "::error file=larapaper/CHANGELOG.md::the \"## $version\" entry has no \"### LaraPaper $tag\" section; generate it with: sh scripts/larapaper-release-notes.sh $tag"
            status=1
          fi
          if notes="$(sh scripts/larapaper-release-notes.sh "$tag")"; then
            printf '## LaraPaper %s release notes for larapaper/CHANGELOG.md\n\n```markdown\n%s\n```\n' "$tag" "$notes" >> "$GITHUB_STEP_SUMMARY"
            echo "::group::LaraPaper $tag release notes"; printf '%s\n' "$notes"; echo "::endgroup::"
            have="$(printf '%s\n' "$entry" | awk -v h="### LaraPaper $tag" '$0 == h { on = 1 } on && /^### / && $0 != h { exit } on' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
            # Upstream can edit its notes later, and an entry can trim them: a warning only
            if [ "$have" != "$notes" ]; then
              echo "::warning file=larapaper/CHANGELOG.md::the \"### LaraPaper $tag\" section differs from LaraPaper's release notes (see the job summary)"
            fi
          else
            echo "::warning::couldn't fetch LaraPaper $tag's release notes"
          fi
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./larapaper

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build-zip.sh dates the ZIP by the last plugin/src commit

      - name: Build image
        run: docker build -t larapaper-local:ci larapaper

      - name: Start with a fake /data
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          echo '{"app_url": "http://localhost:4567/", "registration_enabled": false}' > "$RUNNER_TEMP/data/options.json"
          # homeassistant:8123 is the fake Home Assistant of the end-to-end test; the
          # calendar proxy goes there too, with the token the Supervisor would provide
          # the ingress port is published for e2e/ingress.mjs, which plays Home Assistant
          # (Home Assistant itself reaches it over its own network, as 172.30.32.2). The
          # end-to-end test runs the pre-render itself, so the background one is off.
          # The device sensors go to a Mosquitto broker on this machine (the Supervisor's
          # MQTT service in Home Assistant), published every 2 s instead of 10.
          docker run -d --name mqtt -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name app -p 4567:8080 -p 127.0.0.1:8099:8099 -e TZ=Europe/Amsterdam \
            -e SUPERVISOR_TOKEN=e2e-supervisor-token -e HA_API_URL=http://homeassistant:8123/api \
            -e LARAPAPER_LOCAL_PRERENDER=0 \
            -e MQTT_HOST=homeassistant -e LARAPAPER_LOCAL_MQTT_INTERVAL=2 \
            -e HA_INGRESS_PROXY=172.16.0.0/12 \
            --add-host homeassistant:host-gateway -v "$RUNNER_TEMP/data:/data" larapaper-local:ci
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:4567/up; then echo "up after ${i}x2s"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Check bundled assets are served
        run: |
          fw="$(yq '.framework_version' plugin/src/settings.yml)"
          for path in "/trmnl-framework/$fw/plugins.min.css" "/trmnl-framework/$fw/plugins.min.js" \
                      /fonts/Inter.ttf /fonts/TRMNL16-Regular.woff2 \
                      /rolling-month-calendar/fullcalendar/7.1.0/all/global.js \
                      /rolling-month-calendar/fullcalendar/7.1.0/locales-all/global.js \
                      /rolling-month-calendar/fullcalendar/7.1.0/skeleton.css; do
            curl -fsS -o /dev/null -w "%{http_code} $path\n" "http://localhost:4567$path"
          done

      - name: Check the render paths, framework settings and options
        run: |
          # screens render from a file:// page, so the assets must exist at the filesystem root
          docker exec app sh -c 'test -s /trmnl-framework/3.4.0/plugins.min.css && test -s /fonts/Inter.ttf && test -s /rolling-month-calendar/fullcalendar/7.1.0/all/global.js && test -s /rolling-month-calendar/fullcalendar/7.1.0/skeleton.css'
          docker exec app sh -c 'for f in /trmnl-framework/3.4.0/LICENSE /fonts/OFL-trmnl.txt /fonts/OFL-classic.txt /fonts/CC-BY-3.0.txt /rolling-month-calendar/fullcalendar/7.1.0/LICENSE.md; do test -s "$f" || { echo "missing $f"; exit 1; }; done'
          docker exec app sh -c '! grep -q "fonts.bunny.net" /var/www/html/resources/views/vendor/trmnl/components/screen.blade.php'
          docker exec app printenv TRMNL_BLADE_FRAMEWORK_CSS_URL | grep -qx '/trmnl-framework/3.4.0/plugins.min.css'
          docker exec app sh -c 'f=/var/www/html/bootstrap/cache/config.php; ! test -f "$f" || grep -q "/trmnl-framework/3.4.0/plugins.min.css" "$f"'
          docker exec app grep -qx 'APP_URL=http://localhost:4567' /var/www/html/.env
          docker exec app grep -qx 'REGISTRATION_ENABLED=0' /var/www/html/.env
          docker exec app grep -qx 'APP_TIMEZONE=Europe/Amsterdam' /var/www/html/.env
          test -s "$RUNNER_TEMP/data/app_key"
          test -s "$RUNNER_TEMP/data/database/database.sqlite"

      - name: Check the calendar proxy only allows calendar reads and forecasts from inside the app
        run: |
          status() {
            # shellcheck disable=SC2016 # PHP code
            docker exec app php -r '$c = stream_context_create(["http" => ["method" => $argv[1], "ignore_errors" => true]]);
              @file_get_contents($argv[2], false, $c); echo explode(" ", $http_response_header[0] ?? "x 000")[1];' "$1" "$2"
          }
          test "$(status POST http://127.0.0.1:8124/api/calendars/calendar.work)" = 403
          test "$(status GET http://127.0.0.1:8124/api/states)" = 404
          # forecasts: a GET for a weather.* entity only (the end-to-end test checks the call it makes)
          test "$(status POST http://127.0.0.1:8124/api/weather/weather.forecast_home)" = 403
          test "$(status GET http://127.0.0.1:8124/api/weather/sensor.secret)" = 404
          test "$(status GET http://127.0.0.1:8124/api/weather/weather.home/../../states)" = 404
          test "$(status GET http://127.0.0.1:8124/api/services/light/turn_on)" = 404
          # not published: the port only listens inside the container
          ! curl -fsS -o /dev/null --max-time 5 http://localhost:8124/api/calendars/calendar.work

      - name: Check ingress only answers Home Assistant, with an ingress path
        run: |
          status() {
            # shellcheck disable=SC2016 # PHP code
            docker exec app php -r '$c = stream_context_create(["http" => ["header" => $argv[2], "ignore_errors" => true]]);
              @file_get_contents($argv[1], false, $c); echo explode(" ", $http_response_header[0] ?? "x 000")[1];' "$1" "$2"
          }
          # from inside the app, not the allowed proxy address
          test "$(status http://127.0.0.1:8099/up 'X-Ingress-Path: /api/hassio_ingress/abc')" = 403
          # from the allowed address, but without a (valid) ingress path
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/up)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Ingress-Path: /elsewhere' http://127.0.0.1:8099/up)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Ingress-Path: /api/hassio_ingress/abc' http://127.0.0.1:8099/up)" = 200

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: End-to-end (recipe ZIP → LaraPaper → fake Home Assistant → TRMNL X screen)
        run: |
          sh scripts/build-zip.sh
          node e2e/run.mjs --container app --url http://localhost:4567 --zip dist/rolling-month-calendar.zip --mqtt mqtt

      - name: Web UI through Home Assistant ingress (login, dashboard, recipe preview and render)
        run: |
          (cd preview && npm ci && npx playwright-core install --only-shell chromium)
          node e2e/ingress.mjs --container app --ingress http://localhost:8099

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screens
          path: e2e/out/*.png
          if-no-files-found: ignore

      - name: Restart keeps the app key and database
        run: |
          key="$(cat "$RUNNER_TEMP/data/app_key")"
          docker restart app
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4567/up && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:4567/up
          test "$(cat "$RUNNER_TEMP/data/app_key")" = "$key"
          docker exec app grep -qx "APP_KEY=$key" /var/www/html/.env

      - name: Logs
        if: always()
        run: docker logs app 2>&1 | tail -100 || true

  # Home Assistant's builder actions, as in its example app repository
  # (home-assistant/apps-example): one native build per architecture, signed with
  # cosign, then a multi-arch manifest under the `image` name from config.yaml.
  publish-prepare:
    needs: [version, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the app config
        id: info
        run: |
          image="$(yq '.image' larapaper/config.yaml)"
          {
            echo "architectures=$(yq -o=json -I=0 '.arch' larapaper/config.yaml)"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=$(yq '.version' larapaper/config.yaml)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  publish-image:
    needs: publish-prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          # Exporting every layer of the LaraPaper base to the Actions cache crashed
          # BuildKit after the push; a release build has nothing worth caching
          cache-gha: false
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./larapaper
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.publish-prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=LaraPaper (local)
            io.hass.url=https://github.com/BartSchuurmans/trmnl-rolling-month-calendar/tree/main/larapaper
          push: true
          skip-existing: ${{ needs.publish-prepare.outputs.version }}
          version: ${{ needs.publish-prepare.outputs.version }}

  publish-manifest:
    needs: [publish-prepare, publish-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.publish-prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.publish-prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.publish-prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.publish-prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.publish-prepare.outputs.version }}
