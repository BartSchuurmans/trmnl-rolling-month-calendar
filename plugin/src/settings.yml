---
# TRMNL recipe settings (trmnlp format). Import into LaraPaper as a ZIP, see README.md.
name: Rolling Month Calendar
id: rolling-month-calendar
refresh_interval: 15
strategy: polling
polling_verb: get
# One URL per calendar: the ICS feeds if any are set, otherwise one Home Assistant
# calendar entity each. The server resolves this with Liquid on every refresh, so the
# Home Assistant window always covers the rolling month: the current week plus up to 6
# weeks ahead. The dates are worked out from the timestamp of today's local midnight
# (561600 s = 6.5 days back, 3758400 s = 43.5 days ahead: the half day keeps a 23- or
# 25-hour DST day from moving the date), which PHP (LaraPaper) and Ruby (TRMNL, Terminus)
# Liquid read alike. ICS feeds are fetched whole; the server parses them and keeps the
# events around today. A weather entity adds one more URL, last: its daily forecast,
# through the LaraPaper (local) app's Home Assistant proxy (a GET there; Home Assistant
# itself only gives forecasts to a POST service call).
polling_url: |-
  {% if ics_urls contains "/" %}{% assign feeds = ics_urls | split: "," %}{% for feed in feeds %}{{ feed | strip | replace: "webcal://", "https://" }}
  {% endfor %}{% else %}{% assign cals = calendars | split: "," %}{% for cal in cals %}{{ ha_url }}/api/calendars/{{ cal | strip }}?start={{ "now" | date: "%Y-%m-%d" | date: "%s" | minus: 561600 | date: "%Y-%m-%d" }}&end={{ "now" | date: "%Y-%m-%d" | date: "%s" | plus: 3758400 | date: "%Y-%m-%d" }}
  {% endfor %}{% endif %}{% if weather_entity contains "weather." %}{{ ha_url }}/api/weather/{{ weather_entity | strip }}
  {% endif %}
# Only Home Assistant gets the token. No "=" in the Liquid here, not even in an assign:
# LaraPaper's importer turns every "=" into ":".
polling_headers: '{% unless ics_urls contains "/" %}Authorization=Bearer {{ ha_token }}{% endunless %}'
# No padding around the calendar (screen--no-bleed), as on TRMNL.com: more room for
# weeks. LaraPaper's importer doesn't read this (0.43.1); there it's the recipe's "Remove
# bleed margin?" box.
no_screen_padding: 'yes'
static_data: '{}'
# Framework version this recipe is built and tested against (LaraPaper's default).
framework_version: 3.3.1
# Descriptions may link out (<a href class="underline" target="_blank">, as on TRMNL.com).
# LaraPaper's form keeps only href (opening in the same tab) and styles the link itself,
# but shows the About text as plain text: its link goes in github_url.
# group: folds fields into collapsible sections on TRMNL.com (named as in README.md's
# Settings); LaraPaper ignores it (0.43.1) and shows one list in this order.
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About
    description: Rolling month calendar fed by ICS feeds (Google, iCloud, Outlook, Fastmail, Nextcloud, ...) or Home Assistant calendar entities. Forked from the TRMNL native calendar plugin.
    github_url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar
  - keyname: ics_urls
    field_type: multi_string
    name: ICS feed URLs
    description: One or more calendar feed links (.ics or webcal://), e.g. Google Calendar's <a href="https://support.google.com/calendar/answer/37648" class="underline" target="_blank">"Secret address in iCal format"</a>; <a href="https://github.com/BartSchuurmans/trmnl-rolling-month-calendar#3-find-your-calendars" class="underline" target="_blank">other services</a>. When set, the Home Assistant fields below are not used. ICS feeds show events up to 30 days ahead, so the grid stops at the last week that is covered.
    placeholder: calendar.google.com/calendar/ical/.../basic.ics
    optional: true
  - keyname: ha_url
    field_type: url
    name: Home Assistant URL
    description: Instead of ICS feeds, Home Assistant calendar entities. Base URL of your Home Assistant instance, reachable from the server. No trailing slash. The default is the <a href="https://github.com/BartSchuurmans/trmnl-rolling-month-calendar#self-hosted-with-larapaper" class="underline" target="_blank">LaraPaper (local) Home Assistant app</a>'s own calendar access, which needs no token.
    default: http://127.0.0.1:8124
    placeholder: http://homeassistant.local:8123
    optional: true
  - keyname: ha_token
    field_type: password
    name: Home Assistant access token
    description: <a href="https://www.home-assistant.io/docs/authentication/" class="underline" target="_blank">Long-lived access token</a> (HA profile → Security → Long-lived access tokens). Leave empty with the LaraPaper (local) app's default URL.
    optional: true
  - keyname: calendars
    field_type: multi_string
    name: Home Assistant calendar entities
    description: One or more HA <a href="https://www.home-assistant.io/integrations/calendar/" class="underline" target="_blank">calendar</a> entity IDs.
    placeholder: calendar.family
    optional: true
  - keyname: calendar_labels
    field_type: multi_string
    name: Calendar prefixes
    group: Calendars
    description: Optional text shown before each event title, one per calendar in the same order as the feeds, plugins or entities (e.g. W:, Kids). Use - for a calendar without one.
    optional: true
  - keyname: calendar_colors
    field_type: multi_string
    name: Calendar colors
    group: Calendars
    description: Optional event background, one per calendar in the same order as the feeds, plugins or entities. A <a href="https://trmnl.com/framework/docs/3.3/colors" class="underline" target="_blank">TRMNL color name</a> (black, gray-10 … gray-75, red, blue-40, …) or a hex color. Names become solid greys on the TRMNL X and dither patterns on 1-bit screens. Use - for a calendar without one.
    optional: true
  - keyname: weather_entity
    field_type: string
    name: Home Assistant weather entity
    group: Weather
    description: Optional. A <a href="https://www.home-assistant.io/integrations/weather/" class="underline" target="_blank">weather entity</a> (e.g. weather.forecast_home) whose daily forecast is shown next to each day number, from today on. Needs the LaraPaper (local) Home Assistant app (<a href="https://github.com/BartSchuurmans/trmnl-rolling-month-calendar#weather" class="underline" target="_blank">how it works</a>) and its default Home Assistant URL above; works with ICS feeds too.
    placeholder: weather.forecast_home
    optional: true
  - keyname: weather_temperatures
    field_type: select
    name: Weather temperatures
    group: Weather
    description: With a weather forecast, show each day's high, or its high and low. The low is left out where the day's line has no room for it.
    options:
      - High: high
      - High and low: high_low
    default: high
  - keyname: first_day
    field_type: select
    name: Week starts on
    group: Grid
    options:
      - Sunday: '0'
      - Monday: '1'
      - Saturday: '6'
    default: '1'
  - keyname: rolling_advancement
    field_type: select
    name: Advance
    group: Grid
    description: Start the grid at the beginning of the current week, or at today.
    options:
      - Weekly: week
      - Daily: day
    default: week
  - keyname: week_overflow
    field_type: select
    name: Busy weeks
    group: Grid
    description: When the weeks don't all fit, show fewer weeks so every event stays visible, or keep at least 3 weeks and end a full day with "+N more".
    options:
      - Show fewer weeks: fewer_weeks
      - Show "+N more": more
    default: fewer_weeks
  - keyname: show_week_numbers
    field_type: boolean
    name: Show week numbers
    group: Grid
    default: false
  - keyname: highlight_today
    field_type: boolean
    name: Highlight today
    group: Grid
    default: true
  - keyname: shade_weekends
    field_type: boolean
    name: Shade weekends
    group: Grid
    default: true
  - keyname: month_header
    field_type: boolean
    name: Show title bar
    group: Grid
    description: TRMNL title bar at the bottom with the recipe name and the visible date range.
    default: false
  - keyname: time_format
    field_type: select
    name: Time format
    group: Events
    options:
      - 24 hour: 24h
      - AM/PM: am/pm
    default: 24h
  - keyname: include_event_time
    field_type: boolean
    name: Show event times
    group: Events
    default: true
  - keyname: display_event_end
    field_type: boolean
    name: Show event end times
    group: Events
    default: true
  - keyname: include_past_events
    field_type: boolean
    name: Show past events
    group: Events
    description: Show events on days before today that are still in the grid.
    default: true
  - keyname: fade_past_events
    field_type: boolean
    name: Fade past events
    group: Events
    description: Grey out events that are over (on earlier days). Greyscale screens only; 1-bit and 2-bit screens with Adapt styles show them as usual.
    default: true
  - keyname: ignored_phrases
    field_type: multi_string
    name: Ignore events containing
    group: Events
    description: Events whose title or description contains any of these phrases are hidden.
    optional: true
  - keyname: ignored_phrases_exact_match
    field_type: multi_string
    name: Ignore events titled exactly
    group: Events
    optional: true
  - keyname: time_zone
    field_type: time_zone
    name: Time zone
    group: Language and time zone
    description: Leave empty to use your LaraPaper user time zone.
    optional: true
  - keyname: locale
    field_type: string
    name: Locale
    group: Language and time zone
    description: Language for day and month names, e.g. en, nl, de, fr (a <a href="https://fullcalendar.io/docs/locale" class="underline" target="_blank">FullCalendar locale</a> code).
    default: en
    optional: true
