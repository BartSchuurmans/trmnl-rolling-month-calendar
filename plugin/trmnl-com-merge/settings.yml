---
# The recipe on TRMNL.com (trmnlp format): the settings of plugin/src/settings.yml with
# the Plugin Merge strategy instead of polling. scripts/build-variant.sh puts this next
# to plugin/src's views and merge.liquid + shared.liquid; see plugin/README.md.
#
# On/off fields default to 'true'/'false' as text: TRMNL.com keeps a boolean field's value
# as that text, and its form left YAML true defaults unticked (v2.2.0).
#
# The form fields are the same settings as plugin/src/settings.yml, minus the sources
# TRMNL.com can't use (ICS feeds need a server that parses them, Home Assistant would have
# to be public), with "Calendar" dropdowns instead of plugin IDs and an API key. preview/variants.mjs checks that the settings both have
# match in type, name, options, default and order.
name: Rolling Month Calendar
refresh_interval: 15
strategy: plugin_merge
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
framework_version: 3.4.0
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About
    category: calendar
    description: "All your TRMNL calendar plugins in one rolling month grid, with what the built-in layout lacks:<br/>• up to eight calendars from different accounts and providers (Google, Outlook, CalDAV, ...) in one grid<br/>• a color and a prefix per calendar<br/>• half and quadrant views for mashups<br/>• busy weeks never cut off: fewer weeks, or \"+N more\"<br/>• finished events faded<br/>• the weather forecast next to the day numbers (optional)<br/><b>Setup, or you only see a week of events:</b> in each calendar plugin's own settings, set Layout to Rolling Month (a calendar plugin only shares the days its layout shows: about a week with the default layout, one day with Today only) and keep it in a playlist (it can be hidden). Then pick it below."
    github_url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar
    email_address: bart@minnozz.com
  - keyname: calendar_1
    field_type: plugin_instance_select
    name: Calendar
    description: '<b>First set this plugin''s Layout to Rolling Month</b> (in its own settings), or only its next few days show: a calendar plugin shares only the days its own layout shows. One of your TRMNL calendar plugins (Google, Outlook, Apple, CalDAV, ...); the list shows all your plugins. Keep it in a playlist (it can be hidden), or its events stop refreshing.'
  - keyname: calendar_2
    field_type: plugin_instance_select
    name: Calendar 2
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_3
    field_type: plugin_instance_select
    name: Calendar 3
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_4
    field_type: plugin_instance_select
    name: Calendar 4
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_5
    field_type: plugin_instance_select
    name: Calendar 5
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_6
    field_type: plugin_instance_select
    name: Calendar 6
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_7
    field_type: plugin_instance_select
    name: Calendar 7
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_8
    field_type: plugin_instance_select
    name: Calendar 8
    description: 'Optional: another calendar plugin, also with its Layout set to Rolling Month and kept in a playlist.'
    optional: true
  - keyname: calendar_labels
    field_type: multi_string
    name: Calendar prefixes
    group: Calendars
    description: Optional text shown before each event title, one per calendar in the same order as the calendars above (e.g. W:, Kids). Use - for a calendar without one.
    optional: true
    default: '-'
  - keyname: calendar_colors
    field_type: multi_string
    name: Calendar colors
    group: Calendars
    description: Optional event background, one per calendar in the same order as the calendars above. A <a href="https://trmnl.com/framework/docs/3.3/colors" class="underline" target="_blank">TRMNL color name</a> (black, gray-10 … gray-75, red, blue-40, …) or a hex color. Names become solid greys on the TRMNL X and dither patterns on 1-bit screens. Use - for a calendar without one.
    optional: true
    default: '-'
  - keyname: weather_plugin
    field_type: plugin_instance_select
    name: Weather
    group: Weather
    description: 'Optional: a weather forecast next to each day number, from today on. Pick TRMNL''s Weather plugin (today and tomorrow) or the <a href="https://trmnl.com/recipes/150460" class="underline" target="_blank">Daily Weather</a> recipe (about a week). Keep it in a playlist (it can be hidden), or the forecast stops refreshing.'
    optional: true
  - keyname: weather_temperatures
    field_type: select
    name: Weather temperatures
    group: Weather
    description: With a weather plugin, show each day's high, or its high and low. The low is left out where the day's line has no room for it.
    options:
    - High: high
    - High and low: high_low
    default: high
  - keyname: first_day
    field_type: select
    name: Week starts on
    group: Grid
    options:
    - Sunday: '0'
    - Monday: '1'
    - Saturday: '6'
    default: '1'
  - keyname: rolling_advancement
    field_type: select
    name: Advance
    group: Grid
    description: Start the grid at the beginning of the current week, or at today.
    options:
    - Weekly: week
    - Daily: day
    default: week
  - keyname: week_overflow
    field_type: select
    name: Busy weeks
    group: Grid
    description: When the weeks don't all fit, show fewer weeks so every event stays visible, or keep at least 3 weeks and end a full day with "+N more".
    options:
    - Show fewer weeks: fewer_weeks
    - Show "+N more": more
    default: fewer_weeks
  - keyname: show_week_numbers
    field_type: boolean
    name: Show week numbers
    group: Grid
    default: 'false'
  - keyname: highlight_today
    field_type: boolean
    name: Highlight today
    group: Grid
    default: 'true'
  - keyname: shade_weekends
    field_type: boolean
    name: Shade weekends
    group: Grid
    default: 'true'
  - keyname: month_header
    field_type: boolean
    name: Show title bar
    group: Grid
    description: TRMNL title bar at the bottom with the recipe name and the visible date range.
    default: 'false'
  - keyname: time_format
    field_type: select
    name: Time format
    group: Events
    options:
    - 24 hour: 24h
    - AM/PM: am/pm
    default: 24h
  - keyname: include_event_time
    field_type: boolean
    name: Show event times
    group: Events
    default: 'true'
  - keyname: display_event_end
    field_type: boolean
    name: Show event end times
    group: Events
    default: 'true'
  - keyname: include_past_events
    field_type: boolean
    name: Show past events
    group: Events
    description: Show events on days before today that are still in the grid.
    default: 'true'
  - keyname: fade_past_events
    field_type: boolean
    name: Fade past events
    group: Events
    description: Grey out events that are over (on earlier days). Greyscale screens only; 1-bit and 2-bit screens show them as usual.
    default: 'true'
  - keyname: ignored_phrases
    field_type: multi_string
    name: Ignore events containing
    group: Events
    description: Events whose title or description contains any of these phrases are hidden.
    optional: true
  - keyname: ignored_phrases_exact_match
    field_type: multi_string
    name: Ignore events titled exactly
    group: Events
    description: Events whose title is exactly one of these are hidden.
    optional: true
  - keyname: time_zone
    field_type: time_zone
    name: Time zone
    group: Language and time zone
    description: Leave empty to use your account's time zone.
    optional: true
  - keyname: locale
    field_type: string
    name: Locale
    group: Language and time zone
    description: Language for day and month names, e.g. en, nl, de, fr (a <a href="https://fullcalendar.io/docs/locale" class="underline" target="_blank">FullCalendar locale</a> code).
    default: en
    optional: true
