name: LaraPaper (local)
version: "0.43.1-7"
slug: larapaper_local
description: >-
  TRMNL BYOS server (LaraPaper) that renders screens without internet access:
  the TRMNL framework and FullCalendar are bundled in the image.
url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar/tree/main/larapaper
# Built and published by .github/workflows/app.yml when the version changes on main
image: ghcr.io/bartschuurmans/larapaper-local
arch:
  - aarch64
  - amd64
init: false
# The Supervisor token lets the bundled calendar proxy read Home Assistant calendars
homeassistant_api: true
startup: services
# The Mosquitto broker's address and login, for the device sensors (mqtt.php); the app
# also runs without a broker
services:
  - mqtt:want
# The web UI through Home Assistant (sidebar, Open Web UI), also away from home;
# ingress_port is left at its default, 8099
ingress: true
panel_icon: mdi:tablet-dashboard
panel_title: LaraPaper
# The TRMNL device API (and the web UI) on the home network
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: TRMNL device API and LaraPaper web UI
options:
  app_url: ""
  registration_enabled: true
  prerender: true
  mqtt: true
schema:
  app_url: url
  registration_enabled: bool
  prerender: bool
  mqtt: bool
