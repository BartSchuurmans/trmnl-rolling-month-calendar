configuration:
  app_url:
    name: App URL
    description: >-
      Address the TRMNL device (and your browser) uses to reach this app, e.g.
      http://192.168.1.10:4567. The device downloads its screen image from here, so
      use an IP address or a name the device can resolve.
  registration_enabled:
    name: Allow registration
    description: Turn off after creating your account.
  prerender:
    name: Render screens ahead of time
    description: >-
      Render each recipe shortly before it goes out of date, so the TRMNL gets a ready
      screen. Off, LaraPaper renders while the TRMNL waits, which can take longer than
      the 15 seconds it waits for.
  mqtt:
    name: Device sensors in Home Assistant
    description: >-
      Show each TRMNL in Home Assistant as a device with its battery, Wi-Fi signal,
      firmware and last check-in, through MQTT. Needs the Mosquitto broker app.
