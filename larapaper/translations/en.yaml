configuration:
  app_url:
    name: App URL
    description: >-
      Address the TRMNL device (and your browser) uses to reach this app, e.g.
      http://192.168.1.10:4567. The device downloads its screen image from here, so
      use an IP address or a name the device can resolve.
  multiuser_registration:
    name: Allow more accounts
    description: >-
      The first account can always be created. Turn on to let anyone reaching the web
      UI create further accounts; LaraPaper then stops rendering Blade recipes.
  mqtt:
    name: Device sensors in Home Assistant
    description: >-
      Show each TRMNL in Home Assistant as a device with its battery, Wi-Fi signal,
      firmware, last check-in and screen, and its sleep mode and refresh interval to
      change, through MQTT. Needs the Mosquitto broker app.
  home_assistant_key:
    name: Home Assistant key for recipes
    description: >-
      Lets recipes read Home Assistant at http://127.0.0.1:8124 without a Home
      Assistant token: enter that as a recipe's Home Assistant URL and this key as its
      access token. Use 24 or more letters, digits, - or _; the app's log suggests a
      random one while this is empty. Recipes
      can read states, calendars, history and templates and get forecasts and to-do
      items, but not control anything. Empty turns it off.
